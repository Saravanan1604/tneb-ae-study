<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#13265a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AE Study">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="theme.js"></script>
<title>TNEB AE Study Site</title>
<meta name="color-scheme" content="light only">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* The Complete Book's colourful study pages as one website. Light only, on purpose: white paper, pastel
   section boxes with numbered badges, the book's own pictures. Desktop: topic sidebar | page | section list.
   Phone: one column, drawer menu, sticky tabs and section chips. */
:root{
  color-scheme:light;
  --paper:#ffffff; --bg:#f4f7fb; --ink:#1b2a4a; --ink-2:#56637a; --line:#dfe6ef; --navy:#13265a;
  --blue:#1d5fc4; --blue-bg:#eef5fe; --blue-bd:#a9c9f0; --blue-hd:#dbeafa;
  --pur:#6a3fc0; --pur-bg:#f6f2ff; --pur-bd:#c9b8f0;
  --grn:#1b7a3a; --grn-bg:#f1faf2; --grn-bd:#a9d8b2;
  --teal:#0f766e; --teal-bg:#eefaf7; --teal-bd:#93d6c9;
  --yel:#a86a00; --yel-bg:#fffaeb; --yel-bd:#f0d48a; --yel-hd:#fff1c2;
  --red:#c62828; --red-bg:#fff4f4; --red-bd:#f2b0b0;
  --pink-box:#fde8ec; --blue-box:#e6f0fd; --yel-box:#fff4d6; --grn-box:#e6f4e8; --pur-box:#f1ebfd;
  --gold:#f2b632; --nbg:#13265a; --s-pur2:#ece4fc; --s-brown2:#f3e5df; --s-yel2:#fff0c4; --s-grn2:#e1f3e4; --s-red2:#fde3e3; --s-org:#fff4e0; --s-yel:#fffbe8; --s-pur:#faf7ff; --s-pale3:#f3f6fb; --s-brown:#fbf4f1; --s-blue2:#eaf1fb; --s-pale2:#f7f9fc; --s-pale:#f6f8fc; --s-blue:#e3eefc; --s-track:#e7ecf3; --s-gray:#eef2f7; --s-red:#fdeeee;
  --a0:#c9d3e0; --a1:#d93636; --a2:#ef7d22; --a3:#e3b100; --a4:#7cb342; --a5:#2e8b57;
  --f-ui:"Noto Sans","DejaVu Sans",system-ui,sans-serif; --f-math:"STIX Two Text","Cambria Math","Times New Roman",serif;
  --hdr:58px;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--hdr) + 72px + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
img{max-width:100%;height:auto;display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
sub,sup{font-size:.7em;line-height:0}
h1,h2,h3,h4{text-wrap:balance}

/* header */
.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);height:var(--hdr);display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);flex:none}
.logo i{width:34px;height:34px;border-radius:8px;background:var(--gold);color:var(--navy);font:800 12px var(--f-ui);font-style:normal;display:grid;place-items:center}
.logo b{font-size:16px;font-weight:800;white-space:nowrap}
.mainnav{display:flex;gap:2px;margin-left:6px}
.mainnav a{color:var(--ink-2);text-decoration:none;font-size:13.5px;font-weight:600;padding:8px 10px;border-radius:7px;white-space:nowrap}
.mainnav a:hover{background:var(--blue-bg);color:var(--blue)}
.mainnav a[aria-current="page"]{background:var(--nbg);color:#fff}
.hsearch{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;height:38px;padding:0 10px;width:min(280px,30vw)}
.hsearch svg,.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;flex:none}
.hsearch input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:500 14px var(--f-ui)}
.iconbtn{display:none;border:0;background:transparent;color:var(--navy);width:42px;height:42px;border-radius:9px;place-items:center}
.botnav{display:none}

/* shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr) 200px;gap:26px;max-width:1380px;margin:0 auto;align-items:start}
.shell.notoc{grid-template-columns:250px minmax(0,1fr)}
.shell.notoc .toc{display:none}
.side{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));max-height:calc(100vh - var(--hdr));overflow:auto;padding:14px 4px 30px 0;overscroll-behavior:contain}
.side h4{margin:14px 8px 4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.side h4 i{width:9px;height:9px;border-radius:2px;background:var(--c)}
.side a{display:flex;align-items:center;gap:8px;width:100%;text-decoration:none;padding:5px 10px;border-radius:7px;font-size:13px;line-height:1.35;color:var(--ink)}
.side a span{flex:1;min-width:0}
.side a em{width:9px;height:9px;border-radius:50%;background:var(--dot,var(--a0));flex:none}
.side a:hover{background:var(--blue-bg)}
.side a[aria-current="page"]{background:var(--red-bg);color:var(--red);font-weight:700}
.side .sideh{display:grid;gap:4px;padding:2px 4px 6px}
.side .sideh a{font-weight:700;color:var(--navy)}
.toc{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px) + 14px);padding-top:16px;font-size:12.5px;max-height:calc(100vh - var(--hdr) - 20px);overflow:auto}
.toc b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.toc a{display:flex;gap:8px;text-decoration:none;color:var(--ink-2);padding:4px 8px;border-left:2px solid var(--line);line-height:1.3}
.toc a i{font-style:normal;font-weight:700;min-width:18px}
.toc a.on{color:var(--navy);border-left-color:var(--red);font-weight:700}
main{min-width:0;padding-bottom:40px}
.chips{display:none}
.loading{padding:40px 0;color:var(--ink-2);text-align:center}

/* page title (book style) */
.crumbs{font-size:12.5px;color:var(--ink-2);padding:14px 0 8px}
.crumbs a{color:var(--ink-2)}
.ptitle{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px}
.trow{display:grid;grid-template-columns:44px minmax(0,1fr) 52px;gap:12px;align-items:center}
.bulb{width:44px;height:44px}
.tband{background:var(--blue-hd);border-radius:12px;text-align:center;padding:10px 12px}
.tband h1{margin:0;font-size:clamp(24px,4.2vw,36px);font-weight:800;color:var(--navy);letter-spacing:-.01em;line-height:1.1}
.tbadge{width:52px;height:52px;border-radius:50%;background:#2b3a5a;color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;border:3px solid #9ec2ed}
.tsub{margin:10px auto 0;max-width:640px;text-align:center;background:var(--yel-hd);border:1px solid var(--yel-bd);border-radius:999px;padding:5px 14px;font-weight:700;font-size:13.5px;color:var(--navy)}
.stats{display:grid;grid-template-columns:1.2fr repeat(5,1fr) 1.5fr;margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--s-pale2)}
.stat{padding:10px 6px;text-align:center;border-left:1px solid var(--line);display:grid;align-content:center}
.stat:first-child{border-left:0;background:var(--s-blue2)}
.stat b{font-size:22px;font-weight:800;line-height:1.1}
.stat:first-child b{font-size:30px;color:var(--navy)}
.stat span{font-size:11px;font-weight:700;color:var(--ink-2);line-height:1.25}
.stat.pr b{font-size:13px;color:#e08a00}
.stat.pr.HIGH b{color:var(--red)}
.stat.pr span{font-weight:500}
.tnote{margin:12px 0 0;background:var(--s-brown);border:1px solid #e8cfc5;border-radius:10px;padding:8px 12px;font-size:13.5px;color:#5d4037}
.mine{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--grn-bg);border:1px solid var(--grn-bd);border-radius:12px;padding:8px 12px;font-size:13.5px}
.mine b{color:var(--navy)}
.mine .btn{margin-left:auto}
.tlinks{margin:12px 0 0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;font-weight:700}
.tlinks a,.tlinks button{text-decoration:none;border:0;background:none;padding:0;color:var(--blue);font-weight:700}
.simlink{display:flex;gap:12px;align-items:center;margin-top:12px;background:linear-gradient(90deg,#e6f4e8,#e6f0fd);border:1.5px solid var(--grn-bd);border-radius:12px;padding:10px 14px;text-decoration:none;color:var(--navy)}
.simlink i{font-style:normal;font-size:26px}
.simlink b{display:block;font-size:15px}
.simlink small{color:var(--ink-2);font-size:12.5px}

/* sections (book boxes) */
.sec{margin-top:22px;border:1.5px solid var(--bd);background:var(--bgc);border-radius:16px;overflow:hidden;content-visibility:auto;contain-intrinsic-size:auto 900px}
.sec>h2{margin:0;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--hd);font-size:19px;font-weight:800;color:var(--navy);line-height:1.25}
.sec>h2 .n{flex:none;min-width:32px;height:32px;padding:0 6px;border-radius:999px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:15px}
.sec>h2 small{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-left:auto;white-space:nowrap}
.sec .in{padding:14px 16px 16px;display:grid;gap:12px;min-width:0}
.sec .in>*{min-width:0}
.sec .lead{margin:0;color:var(--ink-2);font-size:14px}
.t-blue{--c:#2f6fde;--bd:var(--blue-bd);--bgc:var(--blue-bg);--hd:#e3eefc}
.t-pur{--c:#7b4fd6;--bd:var(--pur-bd);--bgc:var(--pur-bg);--hd:#ece4fc}
.t-grn{--c:#2e8b57;--bd:var(--grn-bd);--bgc:var(--grn-bg);--hd:#e1f3e4}
.t-teal{--c:#0f8a7e;--bd:var(--teal-bd);--bgc:var(--teal-bg);--hd:#dcf3ee}
.t-yel{--c:#e09a00;--bd:var(--yel-bd);--bgc:var(--yel-bg);--hd:#fff0c4}
.t-red{--c:#d93636;--bd:var(--red-bd);--bgc:var(--red-bg);--hd:#fde3e3}
.t-navy{--c:#13265a;--bd:#b9c6dc;--bgc:#f3f6fb;--hd:#e3e9f3}
.box{background:var(--paper);border:1px solid var(--line);border-radius:12px}
.fx{font-family:var(--f-math);font-size:17px;line-height:1.55;overflow-wrap:anywhere}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;line-height:1.2;margin:0 .12em}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .2em .05em}
.fr>span:last-child{padding:.05em .2em 0}
.ov{border-top:1px solid currentColor;padding-top:.04em}
.btn{border:1.5px solid var(--line);background:var(--paper);border-radius:9px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--navy)}
.btn:hover{border-color:var(--blue)}
.btn.on{background:var(--grn-box);border-color:var(--grn);color:var(--grn)}
.btn.go{background:var(--nbg);border-color:var(--nbg);color:#fff}
.btn.ok{border-color:var(--grn-bd);color:var(--grn)}
.btn.no{border-color:var(--red-bd);color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.ttab .acts{flex-wrap:nowrap}
.pg{font-size:11.5px;color:var(--ink-2)}

/* the book's pictures: one sprite sheet per topic, cropped with background-position */
.sp{width:100%;background-repeat:no-repeat;background-color:#fff;border-radius:6px;cursor:zoom-in}
.sp.big{cursor:default}

/* diagrams */
.diags{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.diag{padding:12px 14px;display:grid;gap:8px;align-content:start}
.diag.wide{grid-column:1 / -1}
.diag h3{margin:0;font-size:15px;color:var(--pur)}
.diag .cap{margin:0;font-size:13.5px;color:var(--ink-2)}
.qc{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13.5px}
.qc b{color:#e0751a}

/* key formula sections */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kb{border-radius:11px;padding:10px 12px;border:1px solid rgba(0,0,0,.08);font-size:14px}
.kb h4{margin:0 0 4px;font-size:13.5px;color:var(--navy)}
.kb.f{background:var(--pink-box);border-color:#f2b6c2;grid-column:1 / -1}
.qv{overflow-x:auto}
.qv table,.ctab table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--paper)}
.qv caption,.ctab caption{text-align:left;font-weight:700;color:var(--yel);font-size:14px;padding:4px 0 6px}
.qv th,.ctab th{background:var(--yel-hd);color:var(--yel);padding:7px 10px;text-align:center;font-size:12.5px;border:1px solid #f3e2b0}
.qv td,.ctab td{padding:6px 10px;border:1px solid #edf0f4;text-align:center}
.qv td:first-child,.ctab td:first-child{color:var(--blue);font-weight:700;text-align:left}
.opts.lt{grid-template-columns:repeat(auto-fit,minmax(70px,1fr))}
.opts.lt .opt{justify-content:center;padding:10px}
.ub .usub{padding:6px 12px;font-size:13px;color:var(--ink-2);background:var(--s-pale3);border-bottom:1px solid var(--line)}
.ub .usub b{color:var(--navy)}
.ub .acts{padding:9px 12px;border-top:1px solid var(--line)}
.uo{min-width:46px}
.uo.sel{background:var(--blue-box);border-color:var(--blue)}
.uo.right{background:var(--grn-box);border-color:var(--grn);color:var(--grn)}
.uo.wrong{background:var(--s-red);border-color:var(--red);color:var(--red)}
.unum{height:34px;width:150px;border:1.5px solid var(--line);border-radius:8px;padding:0 10px;font:600 14px var(--f-ui);color:var(--ink);background:var(--paper)}
.ufb{padding:0 12px 8px;font-size:14px}
.qbar select{height:34px;border:1.5px solid var(--line);border-radius:8px;font:600 13px var(--f-ui);padding:0 8px;background:var(--paper);color:var(--ink);max-width:100%}
.uq{padding:12px 14px;font-size:15.5px;line-height:1.6}
.uq .uopts{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.uq .uopts li{background:var(--blue-bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
.uq .uopts b{color:var(--blue)}
.qcard .uq{padding:0}
.usol{display:grid;gap:6px;padding:10px 12px;font-size:14.5px;line-height:1.55}
.usol p{margin:0}
.usol .u-ans{font-size:15px}
.usol .u-con{color:var(--ink-2);font-size:13px}
.usol .u-why,.usol .u-mis,.usol .u-tw{border-radius:8px;padding:6px 10px;font-size:13.5px}
.usol .u-why{background:var(--pur-bg);border:1px solid var(--pur-bd)}
.usol .u-mis{background:var(--red-bg);border:1px solid var(--red-bd)}
.usol .u-tw{background:var(--grn-bg);border:1px solid var(--grn-bd)}
.ub .sol{border-top:1px solid var(--line)}
.btn.lnk{margin:0 12px 10px;font-size:12px}
.zoomhint{display:none;font-size:11.5px;color:var(--ink-2);padding:2px 4px}
.gsl{display:grid;gap:6px}
.gsr{display:grid;gap:3px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--paper)}
.gsr:hover{border-color:var(--blue)}
.gsr b{color:var(--navy);font-size:14px}
.gsr .fx{font-size:15px}
.gsr small{color:var(--ink-2);font-size:12px}
.mq{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px}
.trap{margin:0;background:var(--s-red);border:1px solid #f2b6b6;border-radius:11px;padding:9px 12px;font-size:13.5px}
.trap b{color:var(--red)}
.knote{margin:0;font-size:13.5px;background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}

/* learn the formulas */
.lf{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:8px}
.lf .l{padding:10px 12px}
.lf .l h3{margin:0 0 6px;font-size:14px;color:var(--ink-2)}
.lf .l h3 b{color:var(--navy)}
.lf .r{border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;border:1px solid rgba(0,0,0,.06)}
.lf .r p{margin:0 0 4px}
.lf .r .k{font-weight:700}
.k-where{color:var(--navy)}.k-tip{color:var(--yel)}.k-gate{color:var(--red)}.k-tnpsc{color:#8e2c1f}.k-ex{color:var(--grn)}.k-asked{color:var(--pur)}

.au{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.au .t{padding:9px 12px;font-size:14px}
.au .m{background:var(--s-blue);border-radius:9px;padding:6px 10px;font-size:12.5px;color:var(--blue);font-weight:600}
.kw{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kw .box{padding:10px 12px;background:var(--s-pur);border-color:#e2d6fb}
.kw b{display:block;color:var(--pur);font-size:14.5px}
.kw span{font-size:13.5px}
.why{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.why .c{background:var(--s-blue);border:1px solid #b7d1f3;border-radius:11px;padding:9px 12px;font-weight:700;color:var(--navy);font-size:14px}
.why .e{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:14px}
.why .m{background:var(--s-red);border:1px solid #f2b6b6;border-radius:11px;padding:9px 12px;font-size:13.5px}
.why .m b{color:var(--red);display:block}
.why .k{background:var(--grn-box);border:1px solid #b3dcbc;border-radius:11px;padding:9px 12px;font-size:13.5px}
.why .k b{color:var(--grn);display:block}
.ctab{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ctab table{min-width:520px}
.ctab td{text-align:left}

/* sums */
.ss{padding:12px 14px;display:grid;gap:8px;border-color:#f6c9c9}
.ss h3{margin:0;font-size:14.5px}
.ss h3 b{color:var(--red)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ans{background:var(--grn-box);border-radius:9px;padding:7px 12px;font-weight:700;color:var(--grn)}
.ss .tp{color:var(--red);font-size:13.5px;margin:0}
.rs{border-color:#bfe6de}
.rs h3 b{color:var(--teal)}
.takeaway{display:flex;gap:12px;align-items:center;background:var(--s-yel);border:1px solid var(--yel-bd);border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px}
.takeaway svg{width:34px;height:34px;flex:none}

/* MCQs */
.mcq{padding:12px 14px;display:grid;gap:8px}
.mcq .q{font-weight:700}
.src{justify-self:start;font-size:11.5px;font-weight:700;color:#fff;background:var(--nbg);border-radius:6px;padding:2px 8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 12px;font-size:14px;min-width:0}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt i{width:26px;height:26px;border-radius:50%;background:var(--s-gray);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12.5px;flex:none}
.opt.right{border-color:var(--grn);background:var(--grn-box)}
.opt.right i{background:var(--grn);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--s-red)}
.opt.wrong i{background:var(--red);color:#fff}
.opt.sel{border-color:var(--blue);background:var(--blue-box)}
.opt.sel i{background:var(--blue);color:#fff}
.expl{font-size:13.5px;display:grid;gap:3px;background:var(--s-pale);border-radius:9px;padding:8px 12px}
.expl p{margin:0}
.expl .w{color:#8e2c1f}
.score{margin-left:auto;background:var(--grn-box);color:var(--grn);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700}
.score:empty{display:none}
.mcq.noans{border-style:dashed}

/* missing-letter test and flashcards */
.ml{padding:16px;display:grid;gap:12px}
.ml .top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.ml .prog{flex:1 1 160px;height:8px;border-radius:4px;background:var(--s-track);overflow:hidden}
.ml .prog i{display:block;height:100%;background:linear-gradient(90deg,#2f6fde,#7b4fd6);width:0}
.ml .nm{font-weight:800;font-size:16px;color:var(--pur)}
.ml .src2{font-size:12px;color:var(--ink-2)}
.ml .q{font-family:var(--f-math);font-size:clamp(19px,3.6vw,24px);line-height:1.7;background:var(--pink-box);border:1px solid #f2b6c2;border-radius:12px;padding:14px 16px;overflow-wrap:anywhere}
.blank{display:inline-grid;place-items:center;min-width:1.4em;height:1.3em;border:2px dashed var(--red);border-radius:6px;color:var(--red);font-family:var(--f-ui);font-weight:800;font-size:.8em;vertical-align:middle;margin:0 .1em;padding:0 .15em;background:var(--paper)}
.blank.ok{border-style:solid;border-color:var(--grn);color:var(--grn);background:var(--grn-box);font-family:var(--f-math);font-size:1em}
.blank.no{border-style:solid;background:var(--s-red)}
.ml .ch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ml .ch button{height:56px;border:2px solid var(--line);background:var(--paper);border-radius:12px;font-family:var(--f-math);font-size:24px;color:var(--navy)}
.ml .ch button:hover{border-color:var(--pur)}
.ml .ch button.right{border-color:var(--grn);background:var(--grn-box);color:var(--grn)}
.ml .ch button.wrong{border-color:var(--red);background:var(--s-red);color:var(--red)}
.ml .fb{font-size:14px;min-height:22px}
.ml .done{text-align:center;display:grid;gap:8px;justify-items:center}
.ml .done b{font-size:34px;color:var(--pur)}
.ml .hint{font-size:13.5px;color:var(--ink-2)}
.ml .q.hide{color:transparent;text-shadow:0 0 14px rgba(27,42,74,.55);user-select:none}
.ml-src{display:block;font-size:12px;color:var(--ink-2);font-weight:500;margin-top:2px}
.ml-q{font-family:var(--f-math);font-size:19px;font-weight:400;background:var(--pink-box);border:1px solid #f2b6c2;border-radius:10px;padding:8px 12px;margin-top:6px;line-height:1.7}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;background:var(--paper);justify-self:start;max-width:100%}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--nbg);color:#fff}
.more{justify-self:center;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 18px;font-weight:700}

/* GATE sums and past-question rows */
.gs{overflow:hidden}
.gs header,.qr header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.gs header{padding:9px 12px;border-bottom:1px solid var(--line)}
.mk{font-size:11px;font-weight:800;border-radius:5px;padding:2px 7px;background:var(--s-gray)}
.mk.two{background:var(--gold)}
.gs header .pg,.qr header .pg{margin-left:auto}
.gs .im{padding:6px 8px}
.gs .acts{padding:9px 12px;border-top:1px solid var(--line)}
.gs .chain{padding:0 12px 9px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.gs .chain span{background:var(--s-org);color:#7a4a00;border:1px solid #f1d29a;border-radius:7px;padding:2px 8px}
.gs .ans{margin:0 12px 10px}
.self{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
.self b{color:var(--navy)}
.qr{padding:10px 12px;display:grid;gap:6px}
.qr .cn{font-weight:700;font-size:14px}
.qr .fl{background:var(--pink-box);border:1px solid #f2b6c2;border-radius:9px;padding:6px 10px;font-size:16px}
.ex{font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 8px;color:#fff;background:var(--nbg)}
.ex-GATE{background:#c62828}.ex-TNPSC{background:#8e2c1f}.ex-ESE{background:#5d4037}.ex-APGENCO{background:#6a1b9a}.ex-TANGEDCO{background:#1f4e79}
.qbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.ef{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.5fr);gap:4px 14px;padding:9px 12px;border-top:1px solid var(--line);align-items:baseline}
.ef:first-child{border-top:0}
.ef .nm{font-weight:700;font-size:13.5px}
.ef .nm small{display:block;font-weight:400;color:var(--ink-2)}

/* tabs inside a topic */
.pbar{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));z-index:41;display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:6px;margin-top:14px;padding:6px 0;background:var(--bg)}
.pbar button{display:flex;align-items:center;gap:8px;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:7px 10px;position:relative;min-width:0}
.pbar i{font-style:normal;font-size:20px;flex:none}
.pbar span{display:grid;min-width:0}
.pbar b{font-size:14.5px;color:var(--navy)}
.pbar small{font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar button[aria-selected="true"]{background:var(--nbg);border-color:var(--nbg)}
.pbar button[aria-selected="true"] b,.pbar button[aria-selected="true"] small,.pbar button[aria-selected="true"] i{color:#fff}
.pcount{position:absolute;top:-7px;right:-4px;font-style:normal;font-size:11px;font-weight:800;background:var(--red);color:#fff;border-radius:999px;padding:1px 7px}
details.ta{background:var(--paper);border:1px solid var(--line);border-radius:12px}
details.ta summary{cursor:pointer;padding:10px 14px;font-weight:700;color:var(--grn);list-style:none}
details.ta summary::before{content:"▸ ";color:var(--ink-2)}
details.ta[open] summary::before{content:"▾ "}
details.ta .pages{display:grid;gap:10px;padding:0 10px 10px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
.pn a{text-decoration:none;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;color:inherit}
.pn a:last-child{text-align:right}
.pn small{display:block;font-size:12px;color:var(--ink-2)}
.pn b{font-size:16px;color:var(--navy)}
footer.foot{margin-top:30px;padding-block:14px 30px;font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--nbg);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:95;max-width:calc(100vw - 32px)}
.scrim{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:69}
.empty{padding:12px;border:1px dashed var(--line);border-radius:10px;color:var(--ink-2);text-align:center;background:var(--paper)}
.hidden-by-search{display:none!important}
[hidden]{display:none!important}
.lb{position:fixed;inset:0;z-index:90;background:rgba(240,244,250,.97);display:grid;grid-template-rows:auto 1fr;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px}
.lb #lbx{justify-self:end;margin-bottom:8px}
.lb .lbi{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.lb .lbi .sp{width:max(100%,var(--w));max-width:none}

/* home */
.hero{margin-top:14px;background:linear-gradient(120deg,#e3eefc 0%,#f1ebfd 55%,#fff4d6 100%);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:12px}
.hero h1{margin:0;font-size:clamp(24px,4vw,34px);color:var(--navy);line-height:1.15}
.hero p{margin:0;color:var(--ink-2);max-width:760px}
.hero .acts .btn{padding:9px 14px;font-size:14px}
.tsearch{display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;height:42px;padding:0 12px;max-width:420px}
.tsearch input{flex:1;min-width:0;border:0;outline:0;font:500 15px var(--f-ui);color:var(--ink);background:transparent}
.tsearch svg{width:18px;height:18px;stroke:var(--ink-2);fill:none;stroke-width:2;stroke-linecap:round}
.subj{margin-top:26px}
.subj>h2{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:18px;color:var(--navy)}
.subj>h2 i{width:14px;height:14px;border-radius:4px;background:var(--c)}
.subj>h2 small{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tc{display:grid;gap:6px;text-decoration:none;color:inherit;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:10px 12px}
.tc:hover{border-color:var(--c)}
.tc h3{margin:0;font-size:15px;color:var(--navy);line-height:1.3}
.tc .meta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:11.5px;color:var(--ink-2)}
.chip{font-size:10.5px;font-weight:800;letter-spacing:.04em;border-radius:5px;padding:1px 6px;background:var(--s-gray);color:var(--ink-2)}
.chip.HIGH{background:var(--s-red2);color:var(--red)}.chip.MEDIUM{background:var(--s-yel2);color:#9a6200}.chip.LOW{background:var(--s-grn2);color:var(--grn)}
.chip.c4{background:var(--s-brown2);color:#8e2c1f}.chip.v1{background:var(--s-pur2);color:var(--pur)}
.bar{height:8px;border-radius:5px;background:var(--s-track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--col,var(--a5))}
.tc .acc{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
.tc .acc b{color:var(--navy)}

/* progress console */
.con{display:grid;gap:16px;margin-top:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.panel>h2{margin:0;font-size:18px;color:var(--navy);display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.panel>h2 small{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.panel>p{margin:0;color:var(--ink-2);font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.kpi{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.kpi b{display:block;font-size:22px;color:var(--navy);line-height:1.2}
.kpi span{font-size:11.5px;color:var(--ink-2)}
.status{font-size:13px;font-weight:600;color:var(--grn);margin:0}
.heat{display:grid;gap:12px}
.hrow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:start}
.hrow>b{font-size:12.5px;color:var(--ink-2);padding-top:6px;display:flex;gap:6px;align-items:center}
.hrow>b i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.tile{display:grid;gap:2px;text-decoration:none;border-radius:9px;padding:6px 8px;background:var(--tb,#eef2f7);color:var(--tf,var(--ink));border:2px solid transparent;min-height:58px;align-content:space-between}
.tile.HIGH{border-color:rgba(198,40,40,.55)}
.tile span{font-size:11.5px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile b{font-size:15px}
.tile small{font-size:10.5px;opacity:.85}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;margin-right:5px}
.legend .hi{border:2px solid rgba(198,40,40,.55);background:var(--paper)}
.next{display:grid;gap:8px}
.nx{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg)}
.nx>i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff;background:var(--col,var(--navy))}
.nx b{display:block;color:var(--navy)}
.nx small{color:var(--ink-2);font-size:12.5px}
.nx .acts{flex-wrap:nowrap}
.sbars{display:grid;gap:8px}
.sb{display:grid;grid-template-columns:190px minmax(0,1fr) 130px;gap:10px;align-items:center;font-size:13.5px}
.sb .bar{height:12px}
.sb small{color:var(--ink-2);text-align:right}
.ttab{width:100%;border-collapse:collapse;font-size:13.5px}
.ttab th{text-align:left;font-size:12px;color:var(--ink-2);font-weight:700;padding:6px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.ttab td{padding:7px 8px;border-bottom:1px solid #edf0f4;vertical-align:middle}
.ttab td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.ttab .bar{width:90px;display:inline-block;vertical-align:middle;margin-right:6px}
.ttab a{font-weight:700;text-decoration:none}
.srcs{display:flex;flex-wrap:wrap;gap:4px}
.srcs span{font-size:11px;border-radius:5px;padding:1px 6px;background:var(--s-gray);color:var(--ink-2);white-space:nowrap}
.srcs span.bad{background:var(--s-red2);color:var(--red)}
.srcs span.good{background:var(--s-grn2);color:var(--grn)}
.wf{display:grid;gap:6px}
.wfi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;border:1px solid var(--red-bd);background:var(--red-bg);border-radius:10px;padding:8px 12px}
.wfi b{color:var(--navy);font-size:14px}
.wfi small{color:var(--ink-2);font-size:12px;display:block}
.wfi .fx{grid-column:1 / -1;font-size:15.5px;background:var(--paper);border-radius:8px;padding:4px 10px}
.mkset{display:grid;gap:14px}
.mkset fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0;display:grid;gap:8px;min-width:0}
.mkset legend{font-weight:800;color:var(--navy);font-size:14px;padding:0 6px}
.mkset label.r{display:flex;gap:8px;align-items:center;font-size:14px}
.mkset select{height:36px;border:1.5px solid var(--line);border-radius:8px;font:600 14px var(--f-ui);padding:0 8px;background:var(--paper);color:var(--ink);max-width:100%}
.mkrow{display:flex;flex-wrap:wrap;gap:10px 18px}
.mkrow label{display:grid;gap:3px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 14px;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.picks b{grid-column:1 / -1;font-size:12px;color:var(--ink-2);margin-top:6px}
.picks label{display:flex;gap:8px;align-items:center;font-size:13.5px}
.mk-time{font-variant-numeric:tabular-nums;font-weight:800;color:var(--navy);background:var(--yel-box);border:1px solid var(--yel-bd);border-radius:8px;padding:3px 10px;font-size:16px}
.mk-time.low{color:var(--red);background:var(--s-red);border-color:var(--red-bd)}
.mk-top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));background:var(--bg);padding:8px 0;z-index:30}
.mk-top .btn.go{margin-left:auto}
.mk-pal{display:flex;flex-wrap:wrap;gap:4px}
.mk-pal button{width:36px;height:32px;border:1.5px solid var(--line);background:var(--paper);border-radius:7px;font-size:12px;font-weight:700;color:var(--ink-2)}
.mk-pal button.ans{background:var(--blue-box);border-color:var(--blue-bd);color:var(--navy)}
.mk-pal button.flag{box-shadow:inset 0 -3px 0 #e09a00}
.mk-pal button.cur{outline:2px solid var(--navy);outline-offset:1px}
.qcard{padding:14px;display:grid;gap:10px}
.qcard .qs{font-size:11.5px;font-weight:700;color:var(--ink-2)}
.qcard .qq{font-weight:700;font-size:15.5px}
.confirm{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--red)}
details.rv{border:1px solid var(--line);border-radius:10px;background:var(--paper)}
details.rv summary{cursor:pointer;padding:8px 12px;display:flex;gap:10px;font-size:13.5px;list-style:none}
details.rv summary span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
details.rv>div{padding:0 12px 12px;display:grid;gap:8px}
.up{color:#1b7a3a}.dn{color:#c62828}

/* quiz overlay */
.qz{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(10px + env(safe-area-inset-top,0px)) 0 calc(24px + env(safe-area-inset-bottom,0px))}
.qz .wrap{max-width:860px;margin:0 auto;display:grid;gap:12px}
.qz .top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;position:sticky;top:0;z-index:2}
.qz .top b{color:var(--navy)}
.qz .top .btn:last-child{margin-left:auto}

@media (max-width:1199px){
  .shell{grid-template-columns:230px minmax(0,1fr);gap:22px}
  .toc{display:none}
  .chips{display:flex;position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px) + 58px);z-index:40;background:var(--bg);gap:6px;overflow-x:auto;padding:9px 0;scrollbar-width:none;margin-top:8px}
  .chips::-webkit-scrollbar{display:none}
  .chips a{flex:none;text-decoration:none;font-size:13px;font-weight:700;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;color:var(--ink-2)}
  .chips a.on{background:var(--nbg);border-color:var(--nbg);color:#fff}
  html{scroll-padding-top:calc(var(--hdr) + 112px + env(safe-area-inset-top,0px))}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:899px){
  :root{--hdr:54px}
  body{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
  .pbar{gap:4px;padding:5px 0}
  .pbar button{flex-direction:column;align-items:center;justify-content:center;gap:0;padding:5px 2px;text-align:center}
  .pbar i{font-size:17px}.pbar b{font-size:12.5px}.pbar small{display:none}
  .shell,.shell.notoc{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(320px,86vw);max-height:none;z-index:70;background:var(--paper);transform:translateX(-102%);transition:transform .22s;padding:calc(14px + env(safe-area-inset-top,0px)) 8px 30px max(10px,env(safe-area-inset-left,0px));border-right:1px solid var(--line)}
  .side.open{transform:none}
  .mainnav,.hsearch{display:none}
  .hsearch.open{display:flex;position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:8px;width:auto;background:var(--paper);z-index:3;box-shadow:0 4px 14px rgba(0,0,0,.15)}
  .hsearch.open input{font-size:16px}
  .iconbtn{display:grid}
  .botnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--paper);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .botnav a{display:grid;justify-items:center;gap:1px;text-decoration:none;color:var(--ink-2);font-size:11px;font-weight:700;padding:4px 0;border-radius:8px}
  .botnav a i{font-style:normal;font-size:18px;line-height:1.2}
  .botnav a[aria-current="page"]{color:var(--navy);background:var(--blue-bg)}
  .logo b{font-size:15px}
  .ptitle{padding:12px}
  .trow{grid-template-columns:30px minmax(0,1fr) 42px;gap:8px}
  .bulb{width:30px;height:30px}
  .tbadge{width:42px;height:42px;font-size:16px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .stat:nth-child(5){border-left:0}
  .stat:nth-child(n+5){border-top:1px solid var(--line)}
  .stat.pr{grid-column:span 2}
  .diags,.kgrid,.lf,.kw,.why,.opts{grid-template-columns:1fr}
  .au{grid-template-columns:1fr}
  .au .m{justify-self:start}
  .ef{grid-template-columns:1fr}
  .ml .ch{grid-template-columns:1fr 1fr}
  .sec>h2{font-size:17px;padding:10px 12px}
  .sec .in{padding:12px}
  .pn{grid-template-columns:1fr}
  .pn a:last-child{text-align:left}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hrow{grid-template-columns:1fr;gap:4px}
  .hrow>b{padding-top:0}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  .sb{grid-template-columns:minmax(0,1fr) 110px;gap:4px 10px}
  .sb .bar{grid-column:1 / -1;grid-row:2}
  .nx{grid-template-columns:30px minmax(0,1fr)}
  .nx>i{width:30px;height:30px}
  .nx .acts{grid-column:1 / -1}
  .ttab thead{display:none}
  .ttab,.ttab tbody,.ttab tr,.ttab td{display:block;width:100%}
  .ttab tr{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
  .ttab td{border:0;padding:2px 0}
  .ttab td[data-l]::before{content:attr(data-l) ": ";font-size:11.5px;font-weight:700;color:var(--ink-2)}
  .panel{padding:12px}
  .mine .btn{margin-left:0}
  .toast{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .uo{min-height:44px;min-width:52px}
  .unum,.qbar select,.mkset select{font-size:16px}
  .zoomhint{display:block}
  .themebtn{width:38px;height:36px;margin-left:auto}
  .iconbtn#sbtn{margin-left:0}
}

/* dark mode — only when the reader picks it with the theme button (light is the book's look and the default) */
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#161d29; --bg:#0d121a; --ink:#e4e9f2; --ink-2:#9eabbf; --line:#2b3648; --navy:#d6e4ff; --nbg:#2f5fbf;
  --blue:#86b4ff; --blue-bg:#122036; --blue-bd:#2d4b78; --blue-hd:#1a2d4b;
  --pur:#c0a8ff; --pur-bg:#1b1630; --pur-bd:#4a3a80;
  --grn:#74d69a; --grn-bg:#11241a; --grn-bd:#2e6a45;
  --teal:#66d9c9; --teal-bg:#0f2523; --teal-bd:#2a6a62;
  --yel:#f2c45c; --yel-bg:#231c0b; --yel-bd:#6b5420; --yel-hd:#33290e;
  --red:#ff8f85; --red-bg:#2a1414; --red-bd:#7a3434;
  --pink-box:#331c24; --blue-box:#16273f; --yel-box:#2f2610; --grn-box:#15301f; --pur-box:#241c3b;
  --s-red:#3a1a1a; --s-gray:#232c3a; --s-track:#28313f; --s-blue:#18283f; --s-pale:#1a2230; --s-pale2:#19212e; --s-blue2:#1a2840;
  --s-brown:#2b211d; --s-pale3:#1b2331; --s-pur:#1f1a33; --s-yel:#2a230f; --s-org:#2e2412; --s-red2:#3b1c1c; --s-grn2:#163020;
  --s-yel2:#3a2f10; --s-brown2:#33241e; --s-pur2:#2a2142;
}
:root[data-theme="dark"] body::before{background:var(--paper)}
:root[data-theme="dark"] .t-blue{--hd:#1a2d4b}:root[data-theme="dark"] .t-pur{--hd:#251d40}:root[data-theme="dark"] .t-grn{--hd:#16301f}
:root[data-theme="dark"] .t-teal{--hd:#143330}:root[data-theme="dark"] .t-yel{--hd:#33290e}:root[data-theme="dark"] .t-red{--hd:#3a1a1a}:root[data-theme="dark"] .t-navy{--bd:#33415a;--bgc:#141b27;--hd:#1d2737}
:root[data-theme="dark"] .hero{background:linear-gradient(120deg,#16263f 0%,#211a38 55%,#2a2311 100%)}
:root[data-theme="dark"] .simlink{background:linear-gradient(90deg,#15301f,#16273f)}
/* the book's own pastel cards keep their colours, so their text stays dark */
:root[data-theme="dark"] .kb[style],:root[data-theme="dark"] .lf .r,:root[data-theme="dark"] .tile{color:#1b2a4a}
:root[data-theme="dark"] .kb[style] h4{color:#13265a}
:root[data-theme="dark"] .lf .r .pg{color:#4a5568}
/* book pictures are printed on white: soften them a little */
:root[data-theme="dark"] .sp{filter:brightness(.9)}
:root[data-theme="dark"] .tband{background:#1a2d4b}
:root[data-theme="dark"] .tsub{color:var(--ink)}
:root[data-theme="dark"] .stats{background:#eef2f8;border-color:#cfd8e6}
:root[data-theme="dark"] .stat{border-color:#d5dde9}
:root[data-theme="dark"] .stat:first-child{background:#dfe8f5}
:root[data-theme="dark"] .stat:first-child b{color:#13265a}
:root[data-theme="dark"] .stat span{color:#56637a}
:root[data-theme="dark"] .logo i{color:#13265a}
/* eye comfort — for long daytime reading: warm paper instead of white, softer text contrast, and a light
   warm filter over the whole page (like a phone's eye-comfort setting) so the book's white pictures dim too */
:root[data-theme="comfort"]{
  --paper:#fbf4e4; --bg:#f1e7d2; --ink:#3a3024; --ink-2:#6b5d4a; --line:#e3d5b8; --navy:#2f3b5c; --nbg:#3d4f7a;
  --blue-bg:#f3eedf; --s-pale:#f6eedc; --s-pale2:#f7f0df; --s-pale3:#f2ead8; --s-gray:#efe6d3; --s-track:#e6dac2;
}
:root[data-theme="comfort"] body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:2147483646;background:#ffa53c;opacity:.09;mix-blend-mode:multiply}
:root[data-theme="comfort"] .sp,:root[data-theme="comfort"] img{filter:sepia(.12) brightness(.97)}
/* look-up shelf */
.tc.shelf .lnames{font-size:12.5px}
.pgchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pgchips a{font-size:12.5px;font-weight:700;text-decoration:none;color:var(--navy);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:3px 10px}
.refpages{display:grid;gap:16px;margin-top:16px;justify-items:center}
.refpg{margin:0;padding:10px;width:100%;max-width:1120px;display:grid;gap:8px;justify-items:center;scroll-margin-top:calc(var(--hdr) + 12px)}
.refpg figcaption{justify-self:start;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.pgimg{width:100%;border:1px solid var(--line);border-radius:6px}
.fbox{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:4px 10px;max-width:520px}
.fbox input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);padding:6px 0;outline:none}
.symg,[data-grp]{scroll-margin-top:calc(var(--hdr) + 12px)}
.symt{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
.symt th{text-align:left;font-size:12px;color:var(--ink-2);border-bottom:1.5px solid var(--line);padding:6px 8px}
.symt td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
.symt td.sym{font-family:var(--f-math);font-size:18px;font-weight:700;color:var(--navy);white-space:nowrap}
.symt td.fx{font-size:15px}
.symt small{color:var(--ink-2)}
.azl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.azr{padding:10px 12px;display:grid;gap:4px;align-content:start}
.azr b{color:var(--navy);font-size:14.5px}
.azr .fx{font-size:15.5px}
.symr[hidden],.azr[hidden],[data-grp][hidden]{display:none}
@media (max-width:760px){
  .symt{min-width:0}
  .symt thead{display:none}
  .symt tr{display:grid;grid-template-columns:minmax(52px,auto) 1fr;gap:3px 12px;padding:9px 0;border-bottom:1px solid var(--line)}
  .symt td{border:0;padding:0}
  .symt td.sym{grid-row:span 4}
  .symt td:nth-child(n+3){font-size:12.5px;color:var(--ink-2)}
  .symt td.fx{font-size:14px;color:var(--ink)}
}
/* formula & concept simulator labs (sims/engine.js) */
.labs{display:grid;gap:14px}
.lab{padding:14px 16px;display:grid;gap:12px;border-left:4px solid var(--teal)}
.lab header{display:grid;gap:6px}
.lab h3{margin:0;font-size:16.5px;color:var(--navy)}
.lb-ref{background:var(--blue-bg);border:1px solid var(--blue-bd);border-radius:9px;padding:8px 10px;display:grid;gap:3px;font-size:13px}
.lb-ref b{color:var(--navy)}
.lb-ref .fx{font-size:15px}
.lb-c{margin:0;font-size:13.5px;color:var(--ink-2)}
.lb-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.lb-ins{display:grid;gap:9px}
.lb-in{display:grid;gap:3px;font-size:13px;font-weight:600;color:var(--ink)}
.lb-in small{font-weight:400;color:var(--ink-2)}
.lb-row{display:grid;grid-template-columns:1fr 104px;gap:8px;align-items:center}
.lb-in input[type=range]{width:100%;accent-color:var(--teal);height:28px;margin:0}
.lb-in input[type=number],.lb-in input[type=text],.lb-in select,.lb-sel select{font:inherit;font-size:14px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%;min-width:0}
.lb-reset{justify-self:start}
.lb-outs{display:grid;gap:6px;background:var(--teal-bg);border:1px solid var(--teal-bd);border-radius:10px;padding:10px}
.lb-o{display:grid;grid-template-columns:minmax(0,1fr) auto 18px;gap:8px;align-items:baseline;font-size:13px;color:var(--ink-2);border-bottom:1px dashed var(--teal-bd);padding-bottom:5px}
.lb-o:last-child{border-bottom:0;padding-bottom:0}
.lb-o b{font-size:15.5px;color:var(--ink);text-align:right;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.lb-o b small{font-size:11.5px;color:var(--ink-2);font-weight:600}
.lb-o i{font-style:normal;font-weight:800;text-align:center}
.lb-o i.up,.lb-wi td.up{color:var(--grn)}
.lb-o i.dn,.lb-wi td.dn{color:var(--red)}
.lb-o i.eq,.lb-wi td.eq{color:var(--ink-2)}
.lb-plot:empty{display:none}
.lb-svg{width:100%;height:auto;display:block;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.lb-svg text{font-size:11px;fill:var(--ink-2);font-family:var(--f-ui)}
.lb-svg .gl{stroke:var(--line);stroke-width:1}
.lb-svg .ax{stroke:var(--ink-2);stroke-width:1.2}
.lb-svg .mk{stroke:var(--gold);stroke-width:2;stroke-dasharray:5 4}
.lb-svg .dot{fill:var(--gold);stroke:var(--ink);stroke-width:1.5}
.lb-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin-top:6px}
.lb-leg i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.lb-sel{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;font-size:13px;color:var(--ink-2)}
.lb-sel label{display:flex;gap:6px;align-items:center}
.lb-sel select{width:auto;max-width:220px}
.lb-more{display:grid;gap:8px}
.lb-more[hidden]{display:none}
.lb-wi{font-size:13px}
.lb-wi td,.lb-wi th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.lb-wi td:first-child{text-align:left;font-weight:600}
.lb-ck{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;font-size:13px;padding:8px 10px;border-radius:9px;border:1px solid var(--grn-bd);background:var(--grn-bg)}
.lb-ck.bad{border-color:var(--red-bd);background:var(--red-bg)}
.lb-ck>b:first-child{color:var(--grn)}
.lb-ck.bad>b:first-child{color:var(--red)}
.lb-ck .btn.lnk{margin:0 0 0 auto}
.lnames{margin:4px 0 0;font-size:12px;color:var(--ink-2);line-height:1.45}
@media (max-width:760px){
  .lab{padding:12px}
  .lb-grid{grid-template-columns:1fr}
  .lb-row{grid-template-columns:1fr 92px}
  .lb-in input[type=range]{height:34px}
}
.themebtn{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);width:40px;height:38px;border-radius:9px;font-size:17px;display:grid;place-items:center;flex:none}
</style>
